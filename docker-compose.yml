services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dyafa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dyafa}
      POSTGRES_DB: ${POSTGRES_DB:-dyafa_development}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dyafa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/storage/uploads

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "node_modules/.bin/tsx", "src/worker/index.ts"]
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/storage/uploads

volumes:
  pgdata:
  uploads:
